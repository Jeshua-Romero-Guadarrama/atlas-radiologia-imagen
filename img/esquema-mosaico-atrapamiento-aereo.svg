<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img"
     aria-label="Esquema de un corte axial de tórax con patrón en mosaico por bronquiolitis obliterante. A la izquierda la serie en inspiración, con diferencias de densidad poco marcadas. A la derecha la serie en espiración forzada, en la que el pulmón normal se hace denso y resaltan las zonas oscuras de atrapamiento aéreo, que contienen vasos de menor calibre">
  <defs>
    <linearGradient id="tejido" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.45" stop-color="#dbe3ec"/>
      <stop offset="1" stop-color="#aab6c6"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c30"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <clipPath id="pulmonDerecho">
      <ellipse cx="170" cy="300" rx="60" ry="95"/>
    </clipPath>
    <clipPath id="pulmonIzquierdo">
      <ellipse cx="330" cy="300" rx="60" ry="95"/>
    </clipPath>
  </defs>

  <rect width="900" height="600" fill="url(#fondo)"/>

  <text x="450" y="44" text-anchor="middle" fill="#f1f5f9"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600">
    Patrón en mosaico y atrapamiento aéreo
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#93a3b8"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
    En la bronquiolitis obliterante la serie en espiración es la que demuestra la enfermedad
  </text>

  <!-- ================= Leyenda ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93a3b8">
    <rect x="118" y="86" width="20" height="12" rx="2" fill="#101a2b" stroke="#f87171"
          stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="146" y="97">Zona de atrapamiento aéreo con vasos finos</text>
    <rect x="440" y="86" width="20" height="12" rx="2" fill="url(#tejido)" stroke="#8494a8"
          stroke-width="1.2"/>
    <text x="468" y="97">Pulmón normal, más denso en espiración</text>
  </g>

  <!-- ================= Panel A. Inspiración ================= -->
  <g>
    <ellipse cx="250" cy="300" rx="158" ry="118" fill="url(#tejido)" opacity="0.16"/>
    <ellipse cx="250" cy="300" rx="158" ry="118" fill="none" stroke="#8494a8" stroke-width="1.6"/>

    <ellipse cx="170" cy="300" rx="60" ry="95" fill="#2b3d57" stroke="#8494a8" stroke-width="1.3"/>
    <ellipse cx="330" cy="300" rx="60" ry="95" fill="#2b3d57" stroke="#8494a8" stroke-width="1.3"/>

    <g clip-path="url(#pulmonDerecho)">
      <polygon points="118,214 180,208 188,264 130,274" fill="#1f2f47" stroke="#f87171"
               stroke-width="1.2" stroke-dasharray="4 3" opacity="0.55"/>
      <polygon points="112,296 148,292 156,344 116,340" fill="#1f2f47" stroke="#f87171"
               stroke-width="1.2" stroke-dasharray="4 3" opacity="0.55"/>
      <g fill="none" stroke="#cbd5e1" stroke-linecap="round">
        <path d="M231,296 L200,282 L178,266" stroke-width="3.2"/>
        <path d="M178,266 L152,246 L134,232" stroke-width="1.1"/>
        <path d="M231,306 L200,326 L176,352 L156,372" stroke-width="3.2"/>
        <path d="M150,316 L126,324" stroke-width="1.1"/>
      </g>
    </g>
    <g clip-path="url(#pulmonIzquierdo)">
      <polygon points="300,230 366,236 360,290 296,286" fill="#1f2f47" stroke="#f87171"
               stroke-width="1.2" stroke-dasharray="4 3" opacity="0.55"/>
      <polygon points="388,296 352,292 344,344 384,340" fill="#1f2f47" stroke="#f87171"
               stroke-width="1.2" stroke-dasharray="4 3" opacity="0.55"/>
      <g fill="none" stroke="#cbd5e1" stroke-linecap="round">
        <path d="M269,296 L300,282 L322,266" stroke-width="3.2"/>
        <path d="M322,266 L348,246 L366,232" stroke-width="1.1"/>
        <path d="M269,306 L300,326 L324,352 L344,372" stroke-width="3.2"/>
        <path d="M350,316 L374,324" stroke-width="1.1"/>
      </g>
    </g>

    <rect x="228" y="206" width="44" height="192" rx="20" fill="url(#tejido)" opacity="0.5"
          stroke="#8494a8" stroke-width="1.2"/>
    <ellipse cx="250" cy="370" rx="24" ry="20" fill="url(#tejido)" stroke="#8494a8" stroke-width="1.2"/>

    <text x="250" y="458" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      El contraste entre unas zonas y otras es escaso
    </text>

    <text x="250" y="500" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
      Inspiración
    </text>
    <text x="250" y="526" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      Las diferencias de densidad son sutiles
    </text>
    <text x="250" y="548" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      y el estudio puede parecer normal
    </text>
  </g>

  <!-- ================= Panel B. Espiración forzada ================= -->
  <g transform="translate(400,0)">
    <ellipse cx="250" cy="300" rx="158" ry="118" fill="url(#tejido)" opacity="0.16"/>
    <ellipse cx="250" cy="300" rx="158" ry="118" fill="none" stroke="#8494a8" stroke-width="1.6"/>

    <ellipse cx="170" cy="300" rx="60" ry="95" fill="url(#tejido)" opacity="0.62"/>
    <ellipse cx="330" cy="300" rx="60" ry="95" fill="url(#tejido)" opacity="0.62"/>
    <ellipse cx="170" cy="300" rx="60" ry="95" fill="none" stroke="#8494a8" stroke-width="1.3"/>
    <ellipse cx="330" cy="300" rx="60" ry="95" fill="none" stroke="#8494a8" stroke-width="1.3"/>

    <g clip-path="url(#pulmonDerecho)">
      <polygon points="118,214 180,208 188,264 130,274" fill="#101a2b" stroke="#f87171"
               stroke-width="1.5" stroke-dasharray="4 3"/>
      <polygon points="112,296 148,292 156,344 116,340" fill="#101a2b" stroke="#f87171"
               stroke-width="1.5" stroke-dasharray="4 3"/>
      <g fill="none" stroke="#5b6b82" stroke-linecap="round">
        <path d="M231,296 L200,282 L178,266" stroke-width="3.2"/>
        <path d="M231,306 L200,326 L176,352 L156,372" stroke-width="3.2"/>
      </g>
      <g fill="none" stroke="#cbd5e1" stroke-linecap="round">
        <path d="M178,266 L152,246 L134,232" stroke-width="1.1"/>
        <path d="M150,316 L126,324" stroke-width="1.1"/>
      </g>
    </g>
    <g clip-path="url(#pulmonIzquierdo)">
      <polygon points="300,230 366,236 360,290 296,286" fill="#101a2b" stroke="#f87171"
               stroke-width="1.5" stroke-dasharray="4 3"/>
      <polygon points="388,296 352,292 344,344 384,340" fill="#101a2b" stroke="#f87171"
               stroke-width="1.5" stroke-dasharray="4 3"/>
      <g fill="none" stroke="#5b6b82" stroke-linecap="round">
        <path d="M269,296 L300,282 L322,266" stroke-width="3.2"/>
        <path d="M269,306 L300,326 L324,352 L344,372" stroke-width="3.2"/>
      </g>
      <g fill="none" stroke="#cbd5e1" stroke-linecap="round">
        <path d="M322,266 L348,246 L366,232" stroke-width="1.1"/>
        <path d="M350,316 L374,324" stroke-width="1.1"/>
      </g>
    </g>

    <rect x="228" y="206" width="44" height="192" rx="20" fill="url(#tejido)" opacity="0.5"
          stroke="#8494a8" stroke-width="1.2"/>
    <ellipse cx="250" cy="370" rx="24" ry="20" fill="url(#tejido)" stroke="#8494a8" stroke-width="1.2"/>

    <polyline points="134,332 150,400 170,442" fill="none" stroke="#93a3b8" stroke-width="1"/>
    <text x="250" y="458" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      Los vasos son más finos dentro de la zona atrapada
    </text>

    <text x="250" y="500" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
      Espiración forzada
    </text>
    <text x="250" y="526" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      El pulmón normal aumenta su densidad
    </text>
    <text x="250" y="548" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      y el atrapamiento aéreo queda en evidencia
    </text>
  </g>

  <text x="450" y="582" text-anchor="middle" fill="#5b6b82"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    Esquema didáctico de un corte axial. Los vasos finos dentro de la zona hipodensa indican que el mosaico nace en la vía aérea.
  </text>
</svg>
