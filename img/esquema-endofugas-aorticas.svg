<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img"
     aria-label="Esquema de los cinco tipos de endofuga tras la reparación endovascular de un aneurisma de aorta. El tipo uno corresponde al sellado insuficiente proximal o distal, el tipo dos al llenado retrógrado por ramas colaterales, el tipo tres a un defecto o desconexión de los módulos, el tipo cuatro a la porosidad del material y el tipo cinco al crecimiento del saco sin fuga visible">
  <defs>
    <linearGradient id="protesis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.45" stop-color="#dbe3ec"/>
      <stop offset="1" stop-color="#aab6c6"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c30"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#fondo)"/>

  <text x="450" y="44" text-anchor="middle" fill="#f1f5f9"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600">
    Tipos de endofuga aórtica
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#93a3b8"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
    El tipo depende del lugar por el que la sangre vuelve a llenar el saco excluido
  </text>

  <!-- ================= Leyenda ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93a3b8">
    <rect x="120" y="86" width="20" height="12" rx="2" fill="url(#protesis)" stroke="#8494a8" stroke-width="1.1"/>
    <text x="148" y="97">Endoprótesis</text>
    <rect x="270" y="86" width="20" height="12" rx="2" fill="#2b3d57" stroke="#8494a8" stroke-width="1.1"/>
    <text x="298" y="97">Saco aneurismático excluido</text>
    <line x1="500" y1="92" x2="522" y2="92" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
    <text x="530" y="97">Sangre dentro del saco</text>
  </g>

  <!-- ================= Tipo 1 ================= -->
  <g transform="translate(90,0)">
    <ellipse cx="0" cy="262" rx="50" ry="95" fill="#2b3d57" stroke="#8494a8" stroke-width="1.4"/>
    <g stroke="#8494a8" stroke-width="3" opacity="0.75" stroke-linecap="round">
      <line x1="-22" y1="152" x2="-22" y2="182"/>
      <line x1="22" y1="152" x2="22" y2="182"/>
    </g>
    <path d="M-16,150 L-16,320 L-30,410 L-14,410 L-2,330 L2,330 L14,410 L30,410 L16,320 L16,150 Z"
          fill="url(#protesis)" stroke="#8494a8" stroke-width="1.4"/>
    <g stroke="#8494a8" stroke-width="0.8" opacity="0.8">
      <line x1="-16" y1="182" x2="16" y2="182"/>
      <line x1="-16" y1="212" x2="16" y2="212"/>
      <line x1="-16" y1="242" x2="16" y2="242"/>
      <line x1="-16" y1="272" x2="16" y2="272"/>
      <line x1="-16" y1="302" x2="16" y2="302"/>
    </g>
    <path d="M-16,176 C-28,186 -34,200 -34,216" fill="none" stroke="#f87171"
          stroke-width="5" stroke-linecap="round"/>
    <circle cx="-34" cy="224" r="7" fill="#f87171"/>

    <text x="0" y="466" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Tipo 1</text>
    <text x="0" y="494" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">Sellado insuficiente</text>
    <text x="0" y="512" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">proximal o distal</text>
  </g>

  <!-- ================= Tipo 2 ================= -->
  <g transform="translate(270,0)">
    <ellipse cx="0" cy="262" rx="50" ry="95" fill="#2b3d57" stroke="#8494a8" stroke-width="1.4"/>
    <g stroke="#8494a8" stroke-width="3" opacity="0.75" stroke-linecap="round">
      <line x1="-22" y1="152" x2="-22" y2="182"/>
      <line x1="22" y1="152" x2="22" y2="182"/>
    </g>
    <path d="M-16,150 L-16,320 L-30,410 L-14,410 L-2,330 L2,330 L14,410 L30,410 L16,320 L16,150 Z"
          fill="url(#protesis)" stroke="#8494a8" stroke-width="1.4"/>
    <g stroke="#8494a8" stroke-width="0.8" opacity="0.8">
      <line x1="-16" y1="182" x2="16" y2="182"/>
      <line x1="-16" y1="212" x2="16" y2="212"/>
      <line x1="-16" y1="242" x2="16" y2="242"/>
      <line x1="-16" y1="272" x2="16" y2="272"/>
      <line x1="-16" y1="302" x2="16" y2="302"/>
    </g>
    <path d="M-72,300 L-48,288" fill="none" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-32" cy="282" r="9" fill="#f87171"/>
    <text x="-56" y="326" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5">Rama lumbar</text>

    <text x="0" y="466" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Tipo 2</text>
    <text x="0" y="494" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">Llenado retrógrado</text>
    <text x="0" y="512" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">por ramas colaterales</text>
  </g>

  <!-- ================= Tipo 3 ================= -->
  <g transform="translate(450,0)">
    <ellipse cx="0" cy="262" rx="50" ry="95" fill="#2b3d57" stroke="#8494a8" stroke-width="1.4"/>
    <g stroke="#8494a8" stroke-width="3" opacity="0.75" stroke-linecap="round">
      <line x1="-22" y1="152" x2="-22" y2="182"/>
      <line x1="22" y1="152" x2="22" y2="182"/>
    </g>
    <path d="M-16,150 L-16,246 L16,246 L16,150 Z" fill="url(#protesis)" stroke="#8494a8" stroke-width="1.4"/>
    <path d="M-16,264 L-16,320 L-30,410 L-14,410 L-2,330 L2,330 L14,410 L30,410 L16,320 L16,264 Z"
          fill="url(#protesis)" stroke="#8494a8" stroke-width="1.4"/>
    <g stroke="#8494a8" stroke-width="0.8" opacity="0.8">
      <line x1="-16" y1="182" x2="16" y2="182"/>
      <line x1="-16" y1="212" x2="16" y2="212"/>
      <line x1="-16" y1="288" x2="16" y2="288"/>
      <line x1="-16" y1="308" x2="16" y2="308"/>
    </g>
    <path d="M-18,255 L-38,250" fill="none" stroke="#f87171" stroke-width="5" stroke-linecap="round"/>
    <path d="M18,255 L38,250" fill="none" stroke="#f87171" stroke-width="5" stroke-linecap="round"/>
    <rect x="-17" y="248" width="34" height="14" fill="#f87171" fill-opacity="0.5"/>

    <text x="0" y="466" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Tipo 3</text>
    <text x="0" y="494" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">Defecto o desconexión</text>
    <text x="0" y="512" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">de los módulos</text>
  </g>

  <!-- ================= Tipo 4 ================= -->
  <g transform="translate(630,0)">
    <ellipse cx="0" cy="262" rx="50" ry="95" fill="#2b3d57" stroke="#8494a8" stroke-width="1.4"/>
    <g stroke="#8494a8" stroke-width="3" opacity="0.75" stroke-linecap="round">
      <line x1="-22" y1="152" x2="-22" y2="182"/>
      <line x1="22" y1="152" x2="22" y2="182"/>
    </g>
    <path d="M-16,150 L-16,320 L-30,410 L-14,410 L-2,330 L2,330 L14,410 L30,410 L16,320 L16,150 Z"
          fill="url(#protesis)" stroke="#8494a8" stroke-width="1.4"/>
    <g stroke="#8494a8" stroke-width="0.8" opacity="0.8">
      <line x1="-16" y1="182" x2="16" y2="182"/>
      <line x1="-16" y1="212" x2="16" y2="212"/>
      <line x1="-16" y1="242" x2="16" y2="242"/>
      <line x1="-16" y1="272" x2="16" y2="272"/>
      <line x1="-16" y1="302" x2="16" y2="302"/>
    </g>
    <g fill="#f87171">
      <circle cx="-22" cy="196" r="4"/>
      <circle cx="22" cy="222" r="4"/>
      <circle cx="-23" cy="252" r="4"/>
      <circle cx="23" cy="280" r="4"/>
      <circle cx="-21" cy="304" r="4"/>
      <circle cx="21" cy="176" r="4"/>
    </g>

    <text x="0" y="466" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Tipo 4</text>
    <text x="0" y="494" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">Porosidad del material</text>
    <text x="0" y="512" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">de la endoprótesis</text>
  </g>

  <!-- ================= Tipo 5 ================= -->
  <g transform="translate(810,0)">
    <ellipse cx="0" cy="262" rx="62" ry="108" fill="none" stroke="#f87171" stroke-width="1.6"
             stroke-dasharray="6 5"/>
    <ellipse cx="0" cy="262" rx="50" ry="95" fill="#2b3d57" stroke="#8494a8" stroke-width="1.4"/>
    <g stroke="#8494a8" stroke-width="3" opacity="0.75" stroke-linecap="round">
      <line x1="-22" y1="152" x2="-22" y2="182"/>
      <line x1="22" y1="152" x2="22" y2="182"/>
    </g>
    <path d="M-16,150 L-16,320 L-30,410 L-14,410 L-2,330 L2,330 L14,410 L30,410 L16,320 L16,150 Z"
          fill="url(#protesis)" stroke="#8494a8" stroke-width="1.4"/>
    <g stroke="#8494a8" stroke-width="0.8" opacity="0.8">
      <line x1="-16" y1="182" x2="16" y2="182"/>
      <line x1="-16" y1="212" x2="16" y2="212"/>
      <line x1="-16" y1="242" x2="16" y2="242"/>
      <line x1="-16" y1="272" x2="16" y2="272"/>
      <line x1="-16" y1="302" x2="16" y2="302"/>
    </g>
    <g stroke="#f87171" stroke-width="2.4" stroke-linecap="round">
      <line x1="-52" y1="262" x2="-64" y2="262"/>
      <line x1="52" y1="262" x2="64" y2="262"/>
      <line x1="-64" y1="262" x2="-58" y2="256"/>
      <line x1="-64" y1="262" x2="-58" y2="268"/>
      <line x1="64" y1="262" x2="58" y2="256"/>
      <line x1="64" y1="262" x2="58" y2="268"/>
    </g>

    <text x="0" y="466" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Tipo 5</text>
    <text x="0" y="494" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">Crecimiento del saco</text>
    <text x="0" y="512" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">sin fuga visible</text>
  </g>

  <text x="450" y="560" text-anchor="middle" fill="#93a3b8"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5">
    El dato de mayor peso pronóstico es el aumento progresivo del diámetro del saco en los controles.
  </text>
  <text x="450" y="584" text-anchor="middle" fill="#5b6b82"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    Esquema didáctico en proyección frontal de la aorta abdominal con una endoprótesis bifurcada.
  </text>
</svg>
