<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img"
     aria-label="Esquema de la imagen de ecografía pulmonar entre dos costillas. A la izquierda el patrón normal, con la línea pleural brillante y las líneas A horizontales que se repiten a intervalos iguales. A la derecha el síndrome intersticial, con varias líneas B verticales que nacen en la línea pleural, llegan al fondo de la imagen y borran las líneas A">
  <defs>
    <linearGradient id="tejido" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.45" stop-color="#dbe3ec"/>
      <stop offset="1" stop-color="#aab6c6"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c30"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <clipPath id="campo">
      <rect x="60" y="130" width="340" height="330" rx="6"/>
    </clipPath>
  </defs>

  <rect width="900" height="600" fill="url(#fondo)"/>

  <text x="450" y="44" text-anchor="middle" fill="#f1f5f9"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600">
    Ecografía pulmonar: Líneas A y líneas B
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#93a3b8"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
    La exploración se basa en los artefactos que nacen en la interfase entre la pleura y el aire
  </text>

  <!-- ================= Leyenda ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93a3b8">
    <line x1="60" y1="92" x2="82" y2="92" stroke="#f59e0b" stroke-width="3.6"/>
    <text x="90" y="97">Línea pleural</text>
    <line x1="215" y1="92" x2="237" y2="92" stroke="#cbd5e1" stroke-width="2.4"/>
    <text x="245" y="97">Líneas A</text>
    <line x1="345" y1="92" x2="367" y2="92" stroke="#f87171" stroke-width="3.6"/>
    <text x="375" y="97">Líneas B</text>
    <line x1="475" y1="92" x2="497" y2="92" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="505" y="97">Distancia del transductor a la pleura</text>
  </g>

  <!-- ================= Panel A. Patrón normal ================= -->
  <g>
    <rect x="60" y="130" width="340" height="330" rx="6" fill="#0a1120"
          stroke="#334155" stroke-width="1.6"/>
    <g clip-path="url(#campo)">
      <rect x="60" y="130" width="340" height="34" fill="url(#tejido)" opacity="0.55"/>
      <text x="230" y="152" text-anchor="middle" fill="#16233a"
            font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
        Partes blandas de la pared
      </text>

      <!-- Costillas y su sombra acústica -->
      <rect x="76" y="190" width="68" height="270" fill="#04070f"/>
      <rect x="316" y="190" width="68" height="270" fill="#04070f"/>
      <path d="M76,198 A34,22 0 0 1 144,198 Z" fill="url(#tejido)" stroke="#8494a8" stroke-width="1.2"/>
      <path d="M316,198 A34,22 0 0 1 384,198 Z" fill="url(#tejido)" stroke="#8494a8" stroke-width="1.2"/>
      <text x="110" y="218" text-anchor="middle" fill="#93a3b8"
            font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Costilla</text>
      <text x="350" y="218" text-anchor="middle" fill="#93a3b8"
            font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Costilla</text>

      <!-- Línea pleural -->
      <line x1="148" y1="196" x2="312" y2="196" stroke="#f59e0b" stroke-width="3.6"/>
      <text x="230" y="188" text-anchor="middle" fill="#f59e0b"
            font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">Línea pleural</text>

      <!-- Líneas A -->
      <line x1="148" y1="262" x2="312" y2="262" stroke="#cbd5e1" stroke-width="2.4" opacity="0.85"/>
      <line x1="148" y1="328" x2="312" y2="328" stroke="#cbd5e1" stroke-width="2.4" opacity="0.6"/>
      <line x1="148" y1="394" x2="312" y2="394" stroke="#cbd5e1" stroke-width="2.4" opacity="0.4"/>
      <text x="230" y="254" text-anchor="middle" fill="#cbd5e1"
            font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">Líneas A</text>

      <!-- Intervalos iguales -->
      <g stroke="#38bdf8" stroke-width="1.6">
        <line x1="180" y1="132" x2="180" y2="262" stroke-dasharray="6 5" opacity="0.9"/>
        <line x1="172" y1="196" x2="188" y2="196"/>
        <line x1="172" y1="262" x2="188" y2="262"/>
      </g>
      <text x="168" y="170" text-anchor="end" fill="#7dd3fc"
            font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">d</text>
      <text x="168" y="236" text-anchor="end" fill="#7dd3fc"
            font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">d</text>

      <text x="230" y="440" text-anchor="middle" fill="#93a3b8"
            font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
        Las líneas A se repiten a la misma distancia
      </text>
    </g>

    <text x="230" y="500" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
      Patrón A normal
    </text>
    <text x="230" y="526" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      Pleura deslizante y líneas A horizontales
    </text>
    <text x="230" y="548" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      que se repiten a intervalos iguales
    </text>
  </g>

  <!-- ================= Panel B. Líneas B ================= -->
  <g transform="translate(440,0)">
    <rect x="60" y="130" width="340" height="330" rx="6" fill="#0a1120"
          stroke="#334155" stroke-width="1.6"/>
    <g clip-path="url(#campo)">
      <rect x="60" y="130" width="340" height="34" fill="url(#tejido)" opacity="0.55"/>
      <text x="230" y="152" text-anchor="middle" fill="#16233a"
            font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
        Partes blandas de la pared
      </text>

      <rect x="76" y="190" width="68" height="270" fill="#04070f"/>
      <rect x="316" y="190" width="68" height="270" fill="#04070f"/>
      <path d="M76,198 A34,22 0 0 1 144,198 Z" fill="url(#tejido)" stroke="#8494a8" stroke-width="1.2"/>
      <path d="M316,198 A34,22 0 0 1 384,198 Z" fill="url(#tejido)" stroke="#8494a8" stroke-width="1.2"/>
      <text x="110" y="218" text-anchor="middle" fill="#93a3b8"
            font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Costilla</text>
      <text x="350" y="218" text-anchor="middle" fill="#93a3b8"
            font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Costilla</text>

      <!-- Restos de líneas A borrados por las líneas B -->
      <g stroke="#cbd5e1" stroke-width="2.4" opacity="0.3">
        <line x1="148" y1="262" x2="166" y2="262"/>
        <line x1="300" y1="262" x2="312" y2="262"/>
        <line x1="148" y1="328" x2="162" y2="328"/>
        <line x1="302" y1="328" x2="312" y2="328"/>
      </g>

      <!-- Línea pleural -->
      <line x1="148" y1="196" x2="312" y2="196" stroke="#f59e0b" stroke-width="3.6"/>
      <text x="230" y="188" text-anchor="middle" fill="#f59e0b"
            font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">Línea pleural</text>

      <!-- Líneas B verticales -->
      <g fill="#f87171" opacity="0.92">
        <polygon points="176,196 182,196 190,460 168,460"/>
        <polygon points="212,196 218,196 226,460 204,460"/>
        <polygon points="248,196 254,196 262,460 240,460"/>
        <polygon points="284,196 290,196 298,460 276,460"/>
      </g>

      <polyline points="292,296 322,284 336,284" fill="none" stroke="#f87171" stroke-width="1.2"/>
      <text x="340" y="288" fill="#f87171"
            font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">Líneas B</text>
    </g>

    <text x="230" y="500" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
      Síndrome intersticial
    </text>
    <text x="230" y="526" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      Líneas verticales que nacen en la pleura,
    </text>
    <text x="230" y="548" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      llegan al fondo y borran las líneas A
    </text>
  </g>

  <text x="450" y="582" text-anchor="middle" fill="#5b6b82"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    Esquema didáctico. Tres o más líneas B en un campo entre dos costillas definen un campo positivo.
  </text>
</svg>
