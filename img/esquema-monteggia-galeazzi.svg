<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img"
     aria-label="Esquema comparativo de las fracturas luxación del antebrazo. A la izquierda la lesión de Monteggia, con fractura del cúbito proximal y luxación de la cabeza radial. A la derecha la lesión de Galeazzi, con fractura del radio distal y luxación de la articulación radiocubital distal">
  <defs>
    <linearGradient id="hueso" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.45" stop-color="#dbe3ec"/>
      <stop offset="1" stop-color="#aab6c6"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c30"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#fondo)"/>

  <text x="450" y="44" text-anchor="middle" fill="#f1f5f9"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600">
    Fracturas luxación del antebrazo
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#93a3b8"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
    El antebrazo es un anillo cerrado, por eso una fractura desplazada obliga a revisar el extremo contrario
  </text>

  <!-- ================= Leyenda ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93a3b8">
    <line x1="106" y1="92" x2="128" y2="92" stroke="#f87171" stroke-width="4.5" stroke-linecap="round"/>
    <text x="136" y="97">Trazo de fractura</text>
    <rect x="290" y="86" width="20" height="13" rx="3" fill="#f87171" opacity="0.18"
          stroke="#f87171" stroke-width="1.2"/>
    <text x="318" y="97">Articulación luxada</text>
    <line x1="470" y1="92" x2="492" y2="92" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="7 6"/>
    <text x="500" y="97">Línea radiocapitelar</text>
    <circle cx="678" cy="92" r="5" fill="#f59e0b"/>
    <text x="692" y="97">Centro del cóndilo humeral</text>
  </g>

  <!-- ================= Panel A. Monteggia ================= -->
  <g transform="translate(70,0)">
    <!-- Húmero distal -->
    <path d="M150,118 L150,182 C118,186 102,198 102,216 C102,236 120,250 144,250 L200,250
             C224,250 240,236 240,216 C240,198 224,186 192,182 L192,118 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M172,185 C166,200 166,232 172,249" fill="none" stroke="#8494a8"
          stroke-width="1.1" opacity="0.6"/>

    <!-- Cúbito, fragmento proximal -->
    <path d="M198,262 C200,250 212,244 224,248 C233,251 237,258 237,268 L234,316 L200,316 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <!-- Cúbito, fragmento distal desplazado -->
    <path d="M188,326 L222,326 L226,424 L192,424 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <rect x="186" y="416" width="42" height="46" rx="11"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>

    <!-- Radio con la cabeza luxada -->
    <path d="M110,236 L150,330 L152,396 L172,422 L176,460 L104,458 L106,422 L120,398 L120,330 L84,250 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <ellipse cx="97" cy="243" rx="27" ry="14" transform="rotate(-24 97 243)"
             fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>

    <!-- Cóndilo humeral de referencia -->
    <circle cx="136" cy="216" r="22" fill="none" stroke="#f59e0b" stroke-width="1.3" opacity="0.8"/>
    <circle cx="136" cy="216" r="5" fill="#f59e0b"/>

    <!-- Línea radiocapitelar desviada -->
    <line x1="135" y1="332" x2="72" y2="187" stroke="#38bdf8" stroke-width="1.8"
          stroke-dasharray="7 6" opacity="0.9"/>

    <!-- Zona luxada -->
    <rect x="58" y="204" width="74" height="74" rx="14" fill="#f87171" opacity="0.16"
          stroke="#f87171" stroke-width="1.3"/>

    <!-- Trazo de fractura del cúbito -->
    <path d="M192,328 L204,318 L216,326 L230,316" fill="none" stroke="#f87171"
          stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a3b8">
      <line x1="112" y1="384" x2="122" y2="384" stroke="#93a3b8" stroke-width="1"/>
      <text x="108" y="388" text-anchor="end">Radio</text>
      <line x1="228" y1="384" x2="238" y2="384" stroke="#93a3b8" stroke-width="1"/>
      <text x="242" y="388">Cúbito</text>
    </g>

    <text x="170" y="500" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
      Lesión de Monteggia
    </text>
    <text x="170" y="526" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      Fractura del cúbito proximal
    </text>
    <text x="170" y="548" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      con luxación de la cabeza radial
    </text>
  </g>

  <!-- ================= Panel B. Galeazzi ================= -->
  <g transform="translate(490,0)">
    <!-- Húmero distal -->
    <path d="M150,118 L150,182 C118,186 102,198 102,216 C102,236 120,250 144,250 L200,250
             C224,250 240,236 240,216 C240,198 224,186 192,182 L192,118 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M172,185 C166,200 166,232 172,249" fill="none" stroke="#8494a8"
          stroke-width="1.1" opacity="0.6"/>

    <!-- Cúbito íntegro -->
    <path d="M198,262 C200,250 212,244 224,248 C233,251 237,258 237,268 L234,316 L230,420 L202,420 L202,316 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <rect x="194" y="416" width="42" height="46" rx="11"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>

    <!-- Radio con la cabeza en su sitio -->
    <path d="M124,282 L120,398 L104,422 L102,458 L172,460 L170,422 L150,396 L148,282 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <ellipse cx="136" cy="268" rx="27" ry="14"
             fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>

    <!-- Cóndilo humeral de referencia -->
    <circle cx="136" cy="216" r="22" fill="none" stroke="#f59e0b" stroke-width="1.3" opacity="0.8"/>
    <circle cx="136" cy="216" r="5" fill="#f59e0b"/>

    <!-- Línea radiocapitelar correcta -->
    <line x1="136" y1="346" x2="136" y2="186" stroke="#38bdf8" stroke-width="1.8"
          stroke-dasharray="7 6" opacity="0.9"/>

    <!-- Trazo de fractura del radio distal -->
    <path d="M114,386 L127,377 L138,385 L156,375" fill="none" stroke="#f87171"
          stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Articulación radiocubital distal ensanchada -->
    <rect x="166" y="414" width="34" height="52" rx="9" fill="#f87171" opacity="0.16"
          stroke="#f87171" stroke-width="1.3"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a3b8">
      <line x1="112" y1="330" x2="122" y2="330" stroke="#93a3b8" stroke-width="1"/>
      <text x="108" y="334" text-anchor="end">Radio</text>
      <line x1="238" y1="330" x2="248" y2="330" stroke="#93a3b8" stroke-width="1"/>
      <text x="252" y="334">Cúbito</text>
    </g>

    <text x="170" y="500" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
      Lesión de Galeazzi
    </text>
    <text x="170" y="526" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      Fractura del radio distal
    </text>
    <text x="170" y="548" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      con luxación radiocubital distal
    </text>
  </g>

  <text x="450" y="582" text-anchor="middle" fill="#5b6b82"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    Esquema didáctico en proyección frontal. El radio se dibuja a la izquierda de cada par y el cúbito a la derecha.
  </text>
</svg>
