<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img"
     aria-label="Esquema del codo en proyección lateral con las almohadillas grasas. A la izquierda el codo normal, con la almohadilla grasa anterior fina y aplicada sobre la cortical del húmero y la almohadilla posterior oculta en su fosa. A la derecha el derrame articular, que eleva la almohadilla anterior en forma de vela y hace visible la posterior, signo indirecto de fractura de la cabeza radial">
  <defs>
    <linearGradient id="hueso" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.45" stop-color="#dbe3ec"/>
      <stop offset="1" stop-color="#aab6c6"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c30"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#fondo)"/>

  <text x="450" y="44" text-anchor="middle" fill="#f1f5f9"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600">
    Almohadillas grasas del codo
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#93a3b8"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
    El derrame articular despega la grasa y delata una fractura que puede ser casi invisible
  </text>

  <!-- ================= Leyenda ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93a3b8">
    <polygon points="120,86 124,98 104,92" fill="#f59e0b" fill-opacity="0.75" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="132" y="97">Almohadillas grasas</text>
    <rect x="290" y="86" width="20" height="12" rx="3" fill="#f87171" fill-opacity="0.3"
          stroke="#f87171" stroke-width="1.2"/>
    <text x="318" y="97">Derrame articular</text>
    <line x1="470" y1="92" x2="492" y2="92" stroke="#f87171" stroke-width="4.5" stroke-linecap="round"/>
    <text x="500" y="97">Trazo de fractura</text>
  </g>

  <!-- ================= Panel A. Codo normal ================= -->
  <g>
    <!-- Húmero distal -->
    <path d="M224,150 L224,266 C220,282 206,288 198,304 C192,320 198,336 210,344
             C224,352 240,356 254,354 C276,350 292,334 294,312 C296,292 280,282 278,264
             L278,150 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <circle cx="244" cy="322" r="28" fill="none" stroke="#8494a8" stroke-width="1.1" opacity="0.7"/>

    <!-- Cúbito, olécranon y porción proximal -->
    <path d="M288,268 C310,282 320,306 316,334 C310,362 286,382 254,394 L214,420
             L186,420 L184,392 L232,368 C266,352 292,336 292,314 C292,296 280,282 268,272 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>

    <!-- Radio, cabeza, cuello y porción proximal -->
    <path d="M198,368 L218,388 L178,428 L158,408 Z" fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <ellipse cx="212" cy="364" rx="24" ry="14" transform="rotate(45 212 364)"
             fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>

    <!-- Almohadilla grasa anterior, fina y aplicada al hueso -->
    <polygon points="202,282 206,316 180,300" fill="#f59e0b" fill-opacity="0.75"
             stroke="#f59e0b" stroke-width="1.2"/>
    <!-- Almohadilla grasa posterior, oculta en la fosa del olécranon -->
    <polygon points="284,292 288,318 268,306" fill="#f59e0b" fill-opacity="0.3"
             stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#f59e0b">
      <line x1="182" y1="298" x2="170" y2="280" stroke="#f59e0b" stroke-width="1"/>
      <text x="164" y="270" text-anchor="middle">Anterior</text>
      <line x1="284" y1="300" x2="318" y2="280" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
      <text x="336" y="272" text-anchor="middle" opacity="0.75">Posterior</text>
    </g>

    <text x="250" y="462" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      La almohadilla posterior no se ve porque queda dentro de su fosa
    </text>

    <text x="250" y="500" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
      Codo normal
    </text>
    <text x="250" y="526" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      Almohadilla anterior fina y pegada
    </text>
    <text x="250" y="548" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      a la cortical anterior del húmero
    </text>
  </g>

  <!-- ================= Panel B. Derrame articular ================= -->
  <g transform="translate(400,0)">
    <!-- Derrame que distiende la cápsula -->
    <path d="M196,276 C170,286 158,302 162,318 C166,334 182,344 206,346
             C228,348 252,350 272,346 C300,340 320,326 320,306
             C320,288 306,276 286,272 C258,266 224,266 196,276 Z"
          fill="#f87171" fill-opacity="0.28" stroke="#f87171" stroke-width="1.3"/>

    <path d="M224,150 L224,266 C220,282 206,288 198,304 C192,320 198,336 210,344
             C224,352 240,356 254,354 C276,350 292,334 294,312 C296,292 280,282 278,264
             L278,150 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <circle cx="244" cy="322" r="28" fill="none" stroke="#8494a8" stroke-width="1.1" opacity="0.7"/>

    <path d="M288,268 C310,282 320,306 316,334 C310,362 286,382 254,394 L214,420
             L186,420 L184,392 L232,368 C266,352 292,336 292,314 C292,296 280,282 268,272 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>

    <path d="M198,368 L218,388 L178,428 L158,408 Z" fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <ellipse cx="212" cy="364" rx="24" ry="14" transform="rotate(45 212 364)"
             fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <!-- Trazo vertical de la cabeza radial -->
    <path d="M208,348 L218,358 L206,368 L216,378" fill="none" stroke="#f87171"
          stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Almohadilla anterior elevada en vela -->
    <polygon points="200,272 208,320 158,288" fill="#f59e0b" fill-opacity="0.75"
             stroke="#f59e0b" stroke-width="1.2"/>
    <!-- Almohadilla posterior visible fuera de la fosa -->
    <polygon points="296,282 300,320 328,300" fill="#f59e0b" fill-opacity="0.75"
             stroke="#f59e0b" stroke-width="1.2"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#f59e0b">
      <line x1="170" y1="288" x2="164" y2="272" stroke="#f59e0b" stroke-width="1"/>
      <text x="158" y="262" text-anchor="middle">Anterior en vela</text>
      <line x1="318" y1="298" x2="330" y2="280" stroke="#f59e0b" stroke-width="1"/>
      <text x="344" y="270" text-anchor="middle">Posterior visible</text>
    </g>

    <text x="250" y="462" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      Ver la almohadilla posterior siempre es patológico
    </text>

    <text x="250" y="500" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
      Derrame articular
    </text>
    <text x="250" y="526" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      El líquido despega las dos almohadillas
    </text>
    <text x="250" y="548" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      y obliga a buscar el trazo en la cabeza radial
    </text>
  </g>

  <text x="450" y="582" text-anchor="middle" fill="#5b6b82"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    Esquema didáctico en proyección lateral del codo, con la cara anterior a la izquierda y el olécranon a la derecha.
  </text>
</svg>
