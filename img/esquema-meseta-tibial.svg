<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img"
     aria-label="Esquema de los tipos principales de fractura de la meseta tibial. De izquierda a derecha, separación con fragmento lateral en cuña, hundimiento del platillo lateral, forma mixta con separación y hundimiento, y fractura bicondílea con extensión a la metáfisis">
  <defs>
    <linearGradient id="hueso" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.45" stop-color="#dbe3ec"/>
      <stop offset="1" stop-color="#aab6c6"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c30"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#fondo)"/>

  <text x="450" y="44" text-anchor="middle" fill="#f1f5f9"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600">
    Fractura de la meseta tibial
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#93a3b8"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
    El tipo depende del compartimento afectado y del hundimiento de la superficie articular
  </text>

  <!-- ================= Leyenda ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93a3b8">
    <line x1="176" y1="102" x2="198" y2="102" stroke="#f87171" stroke-width="4.5" stroke-linecap="round"/>
    <text x="206" y="107">Trazo de fractura</text>
    <rect x="352" y="96" width="20" height="13" rx="2.5" fill="#f59e0b" opacity="0.32"
          stroke="#f59e0b" stroke-width="1.2"/>
    <text x="380" y="107">Hundimiento articular</text>
    <line x1="580" y1="102" x2="602" y2="102" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="7 6"/>
    <text x="610" y="107">Nivel articular normal</text>
  </g>

  <!-- Línea de referencia de la superficie articular, común a los cuatro esquemas -->
  <line x1="24" y1="218" x2="876" y2="218" stroke="#38bdf8" stroke-width="1.6"
        stroke-dasharray="7 7" opacity="0.6"/>

  <!-- ================= Panel 1. Separación ================= -->
  <g transform="translate(36,0)">
    <path d="M22,124 L168,124 L168,176 C168,196 150,206 126,204 C110,202 100,194 95,184
             C90,194 80,202 64,204 C40,206 22,196 22,176 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M18,218 L136,218 L139,258 L151,291 L116,338 L116,420 L76,420 L76,338 L24,272 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M136,218 L172,218 L166,272 L151,291 L139,258 Z" transform="translate(8,0)"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M82,218 L88,204 L94,216 L100,202 L106,218 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.4"/>
    <path d="M138,220 L142,258 L154,290" fill="none" stroke="#f87171"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="95" y="464" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
      Separación
    </text>
    <text x="95" y="490" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
      Fragmento lateral en cuña
    </text>
    <text x="95" y="510" text-anchor="middle" fill="#6f8098"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
      Meseta ensanchada
    </text>
  </g>

  <!-- ================= Panel 2. Hundimiento ================= -->
  <g transform="translate(246,0)">
    <path d="M22,124 L168,124 L168,176 C168,196 150,206 126,204 C110,202 100,194 95,184
             C90,194 80,202 64,204 C40,206 22,196 22,176 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M18,218 L118,218 L122,244 L158,244 L166,224 L166,272 L116,338 L116,420
             L76,420 L76,338 L24,272 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M118,218 L166,218 L166,224 L158,244 L122,244 Z"
          fill="#f59e0b" opacity="0.42" stroke="#f59e0b" stroke-width="1.3"/>
    <path d="M82,218 L88,204 L94,216 L100,202 L106,218 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.4"/>
    <path d="M120,220 L124,244" fill="none" stroke="#f87171"
          stroke-width="4" stroke-linecap="round"/>
    <path d="M124,244 L158,244 L165,226" fill="none" stroke="#f87171"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="95" y="464" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
      Hundimiento
    </text>
    <text x="95" y="490" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
      Depresión del platillo lateral
    </text>
    <text x="95" y="510" text-anchor="middle" fill="#6f8098"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
      Sin fragmento separado
    </text>
  </g>

  <!-- ================= Panel 3. Mixta ================= -->
  <g transform="translate(456,0)">
    <path d="M22,124 L168,124 L168,176 C168,196 150,206 126,204 C110,202 100,194 95,184
             C90,194 80,202 64,204 C40,206 22,196 22,176 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M18,218 L136,218 L139,258 L151,291 L116,338 L116,420 L76,420 L76,338 L24,272 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M136,218 L172,218 L166,272 L151,291 L139,258 Z" transform="translate(8,14)"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M144,218 L180,218 L180,232 L144,232 Z"
          fill="#f59e0b" opacity="0.42" stroke="#f59e0b" stroke-width="1.3"/>
    <path d="M82,218 L88,204 L94,216 L100,202 L106,218 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.4"/>
    <path d="M138,220 L142,258 L154,290" fill="none" stroke="#f87171"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="95" y="464" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
      Mixta
    </text>
    <text x="95" y="490" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
      Separación y hundimiento
    </text>
    <text x="95" y="510" text-anchor="middle" fill="#6f8098"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
      Forma muy frecuente
    </text>
  </g>

  <!-- ================= Panel 4. Bicondílea ================= -->
  <g transform="translate(666,0)">
    <path d="M22,124 L168,124 L168,176 C168,196 150,206 126,204 C110,202 100,194 95,184
             C90,194 80,202 64,204 C40,206 22,196 22,176 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M18,218 L172,218 L166,272 L116,338 L116,420 L76,420 L76,338 L24,272 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M82,218 L88,204 L94,216 L100,202 L106,218 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.4"/>
    <path d="M134,222 L138,258 L150,290" fill="none" stroke="#f87171"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M58,222 L54,254 L42,278" fill="none" stroke="#f87171"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M78,332 L90,324 L102,332 L114,324" fill="none" stroke="#f87171"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="95" y="464" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
      Bicondílea
    </text>
    <text x="95" y="490" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
      Los dos platillos afectados
    </text>
    <text x="95" y="510" text-anchor="middle" fill="#6f8098"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
      Trazo hacia la metáfisis
    </text>
  </g>

  <text x="450" y="558" text-anchor="middle" fill="#5b6b82"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    Proyección frontal de la rodilla. El compartimento lateral se dibuja a la derecha de cada esquema.
  </text>
  <text x="450" y="578" text-anchor="middle" fill="#5b6b82"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    Esquema didáctico. La medida del escalón articular en tomografía decide la indicación quirúrgica.
  </text>
</svg>
