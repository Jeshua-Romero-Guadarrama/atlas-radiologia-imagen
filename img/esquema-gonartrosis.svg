<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img"
     aria-label="Esquema de la artrosis de rodilla. El primer panel señala los tres compartimentos, el femorotibial medial, el femorotibial lateral y el femoropatelar. Los paneles siguientes muestran la progresión, con pinzamiento del compartimento medial, osteofitos marginales, esclerosis subcondral, geodas y deformidad en varo">
  <defs>
    <linearGradient id="hueso" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.45" stop-color="#dbe3ec"/>
      <stop offset="1" stop-color="#aab6c6"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c30"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#fondo)"/>

  <text x="450" y="44" text-anchor="middle" fill="#f1f5f9"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600">
    Artrosis de rodilla
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#93a3b8"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
    El desgaste predomina en el compartimento medial y avanza hacia la deformidad en varo
  </text>

  <!-- ================= Leyenda ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93a3b8">
    <rect x="46" y="96" width="20" height="13" rx="2.5" fill="#f59e0b" opacity="0.22"
          stroke="#f59e0b" stroke-width="1.3"/>
    <text x="74" y="107">Compartimento articular</text>
    <rect x="262" y="96" width="20" height="13" rx="2.5" fill="#f87171" opacity="0.4"
          stroke="#f87171" stroke-width="1.2"/>
    <text x="290" y="107">Osteofitos y esclerosis</text>
    <circle cx="492" cy="102" r="7" fill="#8ea0b4" stroke="#f87171" stroke-width="2"/>
    <text x="506" y="107">Geoda subcondral</text>
    <line x1="654" y1="102" x2="676" y2="102" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="7 6"/>
    <text x="684" y="107">Nivel articular normal</text>
  </g>

  <!-- Línea de referencia del borde inferior de los cóndilos sanos, común a los tres esquemas -->
  <line x1="30" y1="251" x2="870" y2="251" stroke="#38bdf8" stroke-width="1.6"
        stroke-dasharray="7 7" opacity="0.6"/>

  <!-- ================= Panel 1. Rodilla normal ================= -->
  <g transform="translate(45,0)">
    <path d="M80,130 L150,130 L156,178 C184,184 200,196 200,208 L200,224
             C200,246 178,255 152,251 C132,248 120,240 115,228
             C110,240 98,248 78,251 C52,255 30,246 30,224 L30,208 C30,196 46,184 74,178 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <rect x="206" y="304" width="24" height="28" rx="9" fill="url(#hueso)" stroke="#8494a8" stroke-width="1.5"/>
    <rect x="210" y="324" width="17" height="108" fill="url(#hueso)" stroke="#8494a8" stroke-width="1.5"/>
    <path d="M26,270 L204,270 L198,318 L146,368 L146,432 L86,432 L86,368 L34,318 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M100,270 L106,254 L112,268 L118,252 L124,270 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.4"/>
    <ellipse cx="115" cy="206" rx="46" ry="30" fill="#f59e0b" opacity="0.22"
             stroke="#f59e0b" stroke-width="1.4"/>

    <rect x="28" y="240" width="74" height="46" rx="6" fill="#f59e0b" opacity="0.16"
          stroke="#f59e0b" stroke-width="1.4"/>
    <rect x="128" y="240" width="74" height="46" rx="6" fill="#f59e0b" opacity="0.16"
          stroke="#f59e0b" stroke-width="1.4"/>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4a5769"
       text-anchor="middle">
      <text x="66" y="306">Medial</text>
      <text x="164" y="306">Lateral</text>
      <text x="115" y="210">Femoropatelar</text>
    </g>

    <text x="115" y="470" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
      Rodilla normal
    </text>
    <text x="115" y="496" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      Los tres compartimentos
    </text>
    <text x="115" y="516" text-anchor="middle" fill="#6f8098"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      Espacios articulares conservados
    </text>
  </g>

  <!-- ================= Panel 2. Artrosis inicial ================= -->
  <g transform="translate(335,0)">
    <path d="M80,130 L150,130 L156,178 C184,184 200,196 200,208 L200,224
             C200,246 178,255 152,251 C132,248 120,240 115,228
             C110,246 98,260 78,262 C52,266 30,248 30,224 L30,208 C30,196 46,184 74,178 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <rect x="206" y="304" width="24" height="28" rx="9" fill="url(#hueso)" stroke="#8494a8" stroke-width="1.5"/>
    <rect x="210" y="324" width="17" height="108" fill="url(#hueso)" stroke="#8494a8" stroke-width="1.5"/>
    <path d="M26,270 L204,270 L198,318 L146,368 L146,432 L86,432 L86,368 L34,318 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M100,270 L106,254 L112,268 L118,252 L124,270 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.4"/>

    <path d="M29,272 L98,272 L98,282 L31,283 Z" fill="#f87171" opacity="0.4"/>
    <path d="M30,250 L18,260 L36,258 Z" fill="url(#hueso)" stroke="#f87171" stroke-width="2"
          stroke-linejoin="round"/>
    <path d="M27,278 L14,266 L30,270 Z" fill="url(#hueso)" stroke="#f87171" stroke-width="2"
          stroke-linejoin="round"/>

    <text x="115" y="470" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
      Artrosis inicial
    </text>
    <text x="115" y="496" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      Pinzamiento del compartimento medial
    </text>
    <text x="115" y="516" text-anchor="middle" fill="#6f8098"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      Osteofitos incipientes y esclerosis
    </text>
  </g>

  <!-- ================= Panel 3. Artrosis avanzada ================= -->
  <g transform="translate(625,0)">
    <path d="M80,130 L150,130 L156,178 C184,184 200,196 200,208 L200,224
             C200,246 178,255 152,251 C132,248 120,240 115,228
             C110,252 98,268 78,270 C52,274 30,252 30,224 L30,208 C30,196 46,184 74,178 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>

    <g transform="rotate(4 60 270)">
      <rect x="206" y="304" width="24" height="28" rx="9" fill="url(#hueso)" stroke="#8494a8" stroke-width="1.5"/>
      <rect x="210" y="324" width="17" height="108" fill="url(#hueso)" stroke="#8494a8" stroke-width="1.5"/>
      <path d="M26,270 L204,270 L198,318 L146,368 L146,432 L86,432 L86,368 L34,318 Z"
            fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
      <path d="M100,270 L106,250 L112,268 L118,248 L124,270 Z"
            fill="url(#hueso)" stroke="#8494a8" stroke-width="1.4"/>
      <path d="M29,272 L102,272 L102,288 L31,290 Z" fill="#f87171" opacity="0.45"/>
      <circle cx="62" cy="308" r="9" fill="#8ea0b4" stroke="#f87171" stroke-width="2"/>
      <path d="M27,282 L10,266 L30,270 Z" fill="url(#hueso)" stroke="#f87171" stroke-width="2"
            stroke-linejoin="round"/>
      <path d="M204,274 L222,268 L202,286 Z" fill="url(#hueso)" stroke="#f87171" stroke-width="2"
            stroke-linejoin="round"/>
    </g>

    <path d="M30,254 L12,264 L36,262 Z" fill="url(#hueso)" stroke="#f87171" stroke-width="2"
          stroke-linejoin="round"/>
    <path d="M32,240 L36,256 L58,262 L32,262 Z" fill="#f87171" opacity="0.45"/>

    <text x="115" y="470" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
      Artrosis avanzada
    </text>
    <text x="115" y="496" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      El espacio medial desaparece
    </text>
    <text x="115" y="516" text-anchor="middle" fill="#6f8098"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      Geodas, osteofitos grandes y varo
    </text>
  </g>

  <text x="450" y="558" text-anchor="middle" fill="#5b6b82"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    Proyección frontal de la rodilla derecha. El compartimento medial se dibuja a la izquierda de cada esquema.
  </text>
  <text x="450" y="578" text-anchor="middle" fill="#5b6b82"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    Esquema didáctico. El pinzamiento asimétrico separa la artrosis de las artritis inflamatorias.
  </text>
</svg>
