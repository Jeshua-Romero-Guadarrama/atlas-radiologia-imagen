<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img"
     aria-label="Esquema en corte coronal de los síndromes de herniación cerebral. Una masa en el hemisferio derecho desplaza la línea media. Se representan la herniación subfalcina, con el giro del cíngulo que cruza bajo la hoz, la herniación transtentorial descendente, con el uncus que ocupa la cisterna perimesencefálica y comprime el tronco, y la herniación amigdalina, con las amígdalas cerebelosas que descienden por el agujero magno">
  <defs>
    <linearGradient id="tejido" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.45" stop-color="#dbe3ec"/>
      <stop offset="1" stop-color="#aab6c6"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c30"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#fondo)"/>

  <text x="450" y="44" text-anchor="middle" fill="#f1f5f9"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600">
    Síndromes de herniación cerebral
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#93a3b8"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
    Cuando una masa supera la capacidad de compensación, el parénquima pasa de un compartimento a otro
  </text>

  <!-- ================= Leyenda ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93a3b8">
    <line x1="150" y1="92" x2="172" y2="92" stroke="#f59e0b" stroke-width="2.4"/>
    <text x="180" y="97">Hoz, tienda y agujero magno</text>
    <line x1="380" y1="92" x2="402" y2="92" stroke="#f87171" stroke-width="2.4"/>
    <text x="410" y="97">Parénquima herniado</text>
    <line x1="570" y1="92" x2="592" y2="92" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="600" y="97">Desviación de la línea media</text>
  </g>

  <!-- ================= Cavidad craneal ================= -->
  <path id="craneo" d="M406,418 C360,416 322,392 302,356 C280,314 268,272 272,240
           C280,176 350,132 450,132 C550,132 620,176 628,240
           C632,272 620,314 598,356 C578,392 540,416 494,418"
        fill="#152238" stroke="none"/>
  <path d="M406,418 C360,416 322,392 302,356 C280,314 268,272 272,240
           C280,176 350,132 450,132 C550,132 620,176 628,240
           C632,272 620,314 598,356 C578,392 540,416 494,418"
        fill="none" stroke="url(#tejido)" stroke-width="9" stroke-linecap="round"/>
  <path d="M404,420 L400,472" fill="none" stroke="url(#tejido)" stroke-width="9" stroke-linecap="round"/>
  <path d="M496,420 L500,472" fill="none" stroke="url(#tejido)" stroke-width="9" stroke-linecap="round"/>

  <!-- ================= Encéfalo supratentorial ================= -->
  <path d="M450,148 C358,148 296,190 288,244 C284,278 294,306 306,332 L594,332
           C606,306 616,278 612,244 C604,190 542,148 450,148 Z"
        fill="url(#tejido)" opacity="0.42"/>
  <path d="M450,148 C358,148 296,190 288,244 C284,278 294,306 306,332 L594,332
           C606,306 616,278 612,244 C604,190 542,148 450,148 Z"
        fill="none" stroke="#8494a8" stroke-width="1" opacity="0.55"/>

  <!-- Cisura interhemisférica desviada por debajo del borde libre de la hoz -->
  <path d="M450,150 L450,262 C462,286 472,300 474,332" fill="none" stroke="#101a2b" stroke-width="3"/>

  <!-- Ventrículos laterales -->
  <path d="M406,230 C416,238 421,252 415,266 C407,256 402,242 406,230 Z"
        fill="#101a2b" stroke="#8494a8" stroke-width="0.8"/>
  <path d="M496,228 C518,238 528,258 519,278 C503,270 493,248 496,228 Z"
        fill="#101a2b" stroke="#8494a8" stroke-width="0.8"/>

  <!-- Masa expansiva -->
  <circle cx="352" cy="214" r="46" fill="#f87171" fill-opacity="0.32" stroke="#f87171" stroke-width="1.6"/>

  <!-- Cerebelo -->
  <path d="M320,338 C300,370 310,404 344,414 L556,414 C590,404 600,370 580,338 Z"
        fill="url(#tejido)" opacity="0.42"/>
  <path d="M320,338 C300,370 310,404 344,414 L556,414 C590,404 600,370 580,338 Z"
        fill="none" stroke="#8494a8" stroke-width="1" opacity="0.55"/>

  <!-- Tronco del encéfalo -->
  <path d="M434,318 L466,318 L470,470 L430,470 Z" fill="url(#tejido)" opacity="0.6"
        stroke="#8494a8" stroke-width="1"/>

  <!-- Hoz del cerebro y tienda del cerebelo -->
  <line x1="450" y1="146" x2="450" y2="262" stroke="#f59e0b" stroke-width="2.6"/>
  <circle cx="450" cy="262" r="3.6" fill="#f59e0b"/>
  <line x1="306" y1="352" x2="418" y2="318" stroke="#f59e0b" stroke-width="2.6"/>
  <line x1="594" y1="352" x2="482" y2="318" stroke="#f59e0b" stroke-width="2.6"/>
  <line x1="382" y1="418" x2="518" y2="418" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="530" y="414" fill="#f59e0b"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">Agujero magno</text>

  <!-- ================= Herniaciones ================= -->
  <!-- Subfalcina -->
  <path d="M436,258 C454,254 472,264 478,278 C482,290 470,298 456,294 C442,290 434,274 436,258 Z"
        fill="#f87171" fill-opacity="0.3" stroke="#f87171" stroke-width="2"/>
  <!-- Transtentorial descendente -->
  <path d="M408,300 C394,316 398,338 416,344 C430,348 440,336 436,320 C433,310 420,306 408,300 Z"
        fill="#f87171" fill-opacity="0.3" stroke="#f87171" stroke-width="2"/>
  <!-- Amigdalina -->
  <path d="M406,400 C400,424 410,444 422,444 C430,444 430,424 428,400 Z"
        fill="#f87171" fill-opacity="0.3" stroke="#f87171" stroke-width="2"/>
  <path d="M494,400 C500,424 490,444 478,444 C470,444 470,424 472,400 Z"
        fill="#f87171" fill-opacity="0.3" stroke="#f87171" stroke-width="2"/>

  <!-- Desviación de la línea media -->
  <line x1="450" y1="264" x2="450" y2="330" stroke="#38bdf8" stroke-width="1.5"
        stroke-dasharray="6 5" opacity="0.9"/>
  <g stroke="#38bdf8" stroke-width="1.6">
    <line x1="450" y1="318" x2="472" y2="318"/>
    <line x1="450" y1="312" x2="450" y2="324"/>
    <line x1="472" y1="312" x2="472" y2="324"/>
  </g>
  <polyline points="472,318 610,306 658,306" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
  <text x="664" y="310" fill="#7dd3fc"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
    Desviación de la línea media
  </text>

  <!-- ================= Rótulos anatómicos ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#93a3b8">
    <polyline points="450,180 320,162 250,158" fill="none" stroke="#93a3b8" stroke-width="1"/>
    <text x="244" y="162" text-anchor="end">Hoz del cerebro</text>
    <polyline points="308,222 270,214 250,214" fill="none" stroke="#93a3b8" stroke-width="1"/>
    <text x="244" y="218" text-anchor="end">Masa expansiva</text>
    <polyline points="310,350 268,366 250,366" fill="none" stroke="#93a3b8" stroke-width="1"/>
    <text x="244" y="370" text-anchor="end">Tienda del cerebelo</text>
  </g>

  <!-- ================= Números ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <polyline points="472,272 620,196 668,178" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="684" cy="172" r="14" fill="#111c30" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="684" y="177" text-anchor="middle" fill="#f59e0b">1</text>

    <polyline points="404,326 300,300 246,290" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="230" cy="288" r="14" fill="#111c30" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="230" y="293" text-anchor="middle" fill="#f59e0b">2</text>

    <polyline points="494,438 600,452 646,452" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="662" cy="452" r="14" fill="#111c30" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="662" y="457" text-anchor="middle" fill="#f59e0b">3</text>
  </g>

  <!-- ================= Explicación ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <circle cx="160" cy="496" r="12" fill="#111c30" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="160" y="501" fill="#f59e0b" font-size="13" font-weight="600">1</text>
    <text x="160" y="530" fill="#f1f5f9" font-size="14" font-weight="600">Subfalcina</text>
    <text x="160" y="550" fill="#93a3b8" font-size="12.5">El giro del cíngulo cruza bajo la hoz</text>
    <text x="160" y="568" fill="#93a3b8" font-size="12.5">y desvía la línea media</text>

    <circle cx="450" cy="496" r="12" fill="#111c30" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="450" y="501" fill="#f59e0b" font-size="13" font-weight="600">2</text>
    <text x="450" y="530" fill="#f1f5f9" font-size="14" font-weight="600">Transtentorial descendente</text>
    <text x="450" y="550" fill="#93a3b8" font-size="12.5">El uncus ocupa la cisterna perimesencefálica</text>
    <text x="450" y="568" fill="#93a3b8" font-size="12.5">y comprime el tronco del encéfalo</text>

    <circle cx="740" cy="496" r="12" fill="#111c30" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="740" y="501" fill="#f59e0b" font-size="13" font-weight="600">3</text>
    <text x="740" y="530" fill="#f1f5f9" font-size="14" font-weight="600">Amigdalina</text>
    <text x="740" y="550" fill="#93a3b8" font-size="12.5">Las amígdalas cerebelosas descienden</text>
    <text x="740" y="568" fill="#93a3b8" font-size="12.5">por debajo del agujero magno</text>
  </g>
</svg>
