<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img"
     aria-label="Esquema de la clasificación de Weber de las fracturas de tobillo, con los tipos A, B y C según el nivel del trazo respecto a la sindesmosis tibioperonea">
  <defs>
    <linearGradient id="hueso" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="0.45" stop-color="#dbe3ec"/>
      <stop offset="1" stop-color="#aab6c6"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c30"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#fondo)"/>

  <text x="450" y="44" text-anchor="middle" fill="#f1f5f9"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600">
    Clasificación de Weber
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#93a3b8"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
    El tipo depende del nivel del trazo del peroné respecto a la sindesmosis tibioperonea
  </text>

  <!-- Línea de referencia del nivel de la sindesmosis, común a los tres esquemas -->
  <line x1="40" y1="352" x2="860" y2="352" stroke="#38bdf8" stroke-width="1.6"
        stroke-dasharray="7 7" opacity="0.65"/>
  <text x="46" y="345" fill="#7dd3fc"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5">
    Nivel de la sindesmosis
  </text>

  <!-- ================= Panel A ================= -->
  <g transform="translate(60,0)">
    <path d="M42,96 L42,300 L38,340 L40,384 L58,396 L74,392 L108,390 L112,340 L108,96 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M132,110 L128,300 L130,352 L134,398 L152,404 L163,382 L160,340 L158,110 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <rect x="109" y="330" width="22" height="54" rx="4" fill="#f59e0b" opacity="0.32"
          stroke="#f59e0b" stroke-width="1.3"/>
    <path d="M50,404 Q102,442 154,408 L149,458 Q100,476 54,456 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M129,368 L140,375 L150,366 L162,373" fill="none" stroke="#f87171"
          stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="510" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
      Tipo A
    </text>
    <text x="100" y="536" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      Por debajo de la sindesmosis
    </text>
    <text x="100" y="558" text-anchor="middle" fill="#6f8098"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      Suele ser estable
    </text>
  </g>

  <!-- ================= Panel B ================= -->
  <g transform="translate(350,0)">
    <path d="M42,96 L42,300 L38,340 L40,384 L58,396 L74,392 L108,390 L112,340 L108,96 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M132,110 L128,300 L130,352 L134,398 L152,404 L163,382 L160,340 L158,110 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <rect x="109" y="330" width="22" height="54" rx="4" fill="#f59e0b" opacity="0.32"
          stroke="#f59e0b" stroke-width="1.3"/>
    <path d="M50,404 Q102,442 154,408 L149,458 Q100,476 54,456 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M128,334 L139,347 L149,341 L161,357" fill="none" stroke="#f87171"
          stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="510" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
      Tipo B
    </text>
    <text x="100" y="536" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      A la altura de la sindesmosis
    </text>
    <text x="100" y="558" text-anchor="middle" fill="#6f8098"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      Estabilidad variable
    </text>
  </g>

  <!-- ================= Panel C ================= -->
  <g transform="translate(640,0)">
    <path d="M42,96 L42,300 L38,340 L40,384 L58,396 L74,392 L108,390 L112,340 L108,96 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M132,110 L128,300 L130,352 L134,398 L152,404 L163,382 L160,340 L158,110 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <rect x="109" y="330" width="22" height="54" rx="4" fill="#f59e0b" opacity="0.32"
          stroke="#f59e0b" stroke-width="1.3"/>
    <path d="M50,404 Q102,442 154,408 L149,458 Q100,476 54,456 Z"
          fill="url(#hueso)" stroke="#8494a8" stroke-width="1.6"/>
    <path d="M128,258 L139,268 L149,257 L160,266" fill="none" stroke="#f87171"
          stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="510" text-anchor="middle" fill="#f1f5f9"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">
      Tipo C
    </text>
    <text x="100" y="536" text-anchor="middle" fill="#93a3b8"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
      Por encima de la sindesmosis
    </text>
    <text x="100" y="558" text-anchor="middle" fill="#6f8098"
          font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
      Lesión sindesmal, suele ser inestable
    </text>
  </g>

  <!-- ================= Leyenda ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a3b8">
    <rect x="272" y="88" width="15" height="11" rx="2.5" fill="#f59e0b" opacity="0.32"
          stroke="#f59e0b" stroke-width="1.2"/>
    <text x="295" y="98">Sindesmosis tibioperonea</text>
    <line x1="470" y1="93" x2="492" y2="93" stroke="#f87171" stroke-width="4.5"
          stroke-linecap="round"/>
    <text x="500" y="98">Trazo de fractura del peroné</text>
  </g>

  <text x="450" y="586" text-anchor="middle" fill="#5b6b82"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    Esquema didáctico. La tibia se representa a la izquierda de cada par y el peroné a la derecha.
  </text>
</svg>
